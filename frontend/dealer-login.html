<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dealer Login - GasQ LPG</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/dealer.css">
</head>
<body class="dealer-portal">
  <!-- Minimal Top Navigation -->
  <header class="dealer-topbar">
    <div class="dealer-brand-group">
      <a href="/" class="dealer-brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v4M8 6h8M6 10h12v10a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V10z"></path>
        </svg>
        <span>GasQ</span>
      </a>
    </div>

    <div class="dealer-topbar-actions">
      <a href="/customer.html" class="dealer-topbar-link">Customer View</a>
      <a href="/dealer-register.html" class="dealer-topbar-link">Register Depot</a>
    </div>
  </header>

  <!-- Centered Login Card -->
  <main class="dealer-auth-wrapper">
    <article class="dealer-login-card">
      <div class="dealer-login-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </div>

      <div class="dealer-login-header">
        <h2>Dealer Login</h2>
        <p>Access your LPG depot queue and cylinder inventory.</p>
      </div>

      <div id="dealerGoogleSignInBtn" class="google-btn-container" style="margin-bottom: 16px;"></div>

      <form id="loginForm" class="dealer-login-form" method="post" action="#" novalidate>
        <div class="dealer-form-group">
          <label for="loginUsername">Email or Dealer ID</label>
          <input id="loginUsername" class="dealer-input" name="username" type="text" required minlength="3" maxlength="255" placeholder="dealer@example.com or dealer_id" autocomplete="username">
        </div>

        <div class="dealer-form-group">
          <label for="loginPassword">Password</label>
          <div class="password-input-wrap">
            <input id="loginPassword" class="dealer-input" name="password" type="password" required minlength="8" maxlength="72" placeholder="Enter your password" autocomplete="current-password">
            <button type="button" id="toggleLoginPassword" class="password-toggle-btn" aria-label="Toggle password visibility">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button id="loginSubmitBtn" class="dealer-btn btn-primary btn-full" type="submit">
          Login to Dashboard
        </button>
      </form>

      <div class="auth-divider">
        <span>or</span>
      </div>

      <a href="/dealer-register.html" class="dealer-btn btn-secondary btn-full">
        Register New LPG Depot
      </a>
    </article>

    <p id="message" class="dealer-toast-msg" role="status" aria-live="polite"></p>
  </main>

  <script src="/static/js/api.js?v=6"></script>
  <script src="/static/js/auth.js?v=4"></script>
  <script src="/static/js/dealer-auth.js?v=1"></script>
</body>
</html>

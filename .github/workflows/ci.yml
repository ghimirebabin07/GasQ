name: GasQ CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Lint, Audit & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Set up Node.js (for JS syntax verification)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verify Frontend JavaScript Syntax
        run: |
          node --check frontend/js/api.js
          node --check frontend/js/auth.js
          node --check frontend/js/notifications.js
          node --check frontend/js/customer.js
          node --check frontend/js/queue.js
          node --check frontend/js/dealer.js

      - name: Python Static Analysis (Ruff)
        run: |
          ruff check backend

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          pip-audit

      - name: Install Playwright Browsers
        run: |
          playwright install chromium --with-deps

      - name: Run Test Suite & Coverage
        env:
          GASQ_ENVIRONMENT: test
          GASQ_SECRET_KEY: ci-pipeline-secret-key-at-least-32-bytes-long!
          GASQ_DATABASE_URL: sqlite:///./test_ci.db
        run: |
          cd backend
          pytest -v --cov=routers --cov=services --cov=workers --cov-report=term-missing
